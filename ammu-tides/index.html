<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ammu Tides</title>
<meta name="description" content="Ammu's nightly GATE 2027 check-in, with a whale who loves consistency.">
<meta name="theme-color" content="#EEF2FD">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#36406A; --ink-2:#5D6690; --ink-3:#8C93B3;
  --paper:#FCFCFF; --paper-2:#F4F6FD; --line:#E2E6F6;
  --tide:#7DB4E6; --tide-deep:#5B7AD3; --foam:#E6F4FB;
  --shell:#F8C3D0; --shell-deep:#C9617F;
  --lilac:#DCD2F8; --lilac-deep:#7D68C8;
  --mint:#CDEFDF; --mint-deep:#2F8A66;
  --butter:#FFEDBC; --butter-deep:#94700F;
  --peach:#FFDCCD; --peach-deep:#B4532F;
  --r-xl:34px; --r-l:26px; --r-m:18px; --r-s:12px;
  --lift:0 1px 2px rgba(54,64,106,.05),0 18px 44px -18px rgba(91,122,211,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Quicksand',ui-rounded,system-ui,sans-serif;color:var(--ink);font-weight:500;line-height:1.5;
  background:linear-gradient(180deg,#EDF1FD 0%,#F5EFFA 52%,#ECF6F7 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9DB6F2;outline-offset:2px;border-radius:10px}
.app{max-width:1280px;margin:0 auto;padding:22px 24px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none}
.brand h1{margin:0;font-size:32px;line-height:1.05;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.countdown{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border:1px solid var(--line);
  border-radius:999px;padding:7px 16px 7px 8px;font-size:14px;color:var(--ink-2)}
.countdown .num{background:var(--lilac);color:#3E2F7E;font-weight:700;border-radius:999px;padding:4px 12px;font-size:16px}
.layout{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(370px,1fr);gap:26px;align-items:start}
.stage{position:sticky;top:16px}
.tank{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:1000/640;background:#E7F0FA;
  box-shadow:var(--lift);border:7px solid rgba(255,255,255,.85);outline:1px solid var(--line)}
.tank svg{display:block;width:100%;height:100%}
.tank::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0 7%,transparent 7% 12%,rgba(255,255,255,.14) 12% 13.5%,transparent 13.5%)}
.status{display:flex;align-items:center;gap:12px;margin-top:14px;background:rgba(255,255,255,.8);border:1px solid var(--line);
  border-radius:20px;padding:12px 18px;font-size:16px;font-weight:600}
.status .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--mint-deep)}
.status.warn .dot{background:#E2A13A}.status.alert .dot{background:var(--peach-deep)}.status.soft .dot{background:var(--lilac-deep)}
.status .name{font-weight:700}
.says{position:absolute;left:50%;top:16px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;max-width:78%;
  background:#fff;border-radius:22px;padding:10px 18px;font-weight:600;font-size:15px;text-align:center;
  box-shadow:0 10px 30px -12px rgba(54,64,106,.4);transition:opacity .45s ease,transform .45s ease}
.says.on{opacity:1;transform:translate(-50%,0)}
.banner{position:absolute;left:16px;right:16px;top:14px;background:#FFF4E8;border:1px solid #F5D3AE;color:#8A4A1C;
  border-radius:16px;padding:9px 14px;font-weight:600;font-size:14px;display:none}
.banner.on{display:block}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.72);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;color:var(--ink-2)}
.chip .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.chip .ic svg{width:15px;height:15px}
.chip b{color:var(--ink);font-weight:700;font-size:15px}
.week{margin-top:14px;background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:auto repeat(7,1fr);align-items:center;gap:8px}
.week .wl{font-weight:700;font-size:14px;margin-right:4px}
.week .wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-weight:700;min-width:30px}
.week .wc{width:24px;height:24px;border-radius:50%;background:#EEF1F8;display:grid;place-items:center}
.week .wc svg{width:13px;height:13px}
.week .wc.done{background:#CFE6F8;color:#2D5D8C}.week .wc.missed{background:#fff;box-shadow:inset 0 0 0 2px #F3B9A3}
.week .wc.rest{background:#F1EEFA}.week .wc.open{background:#fff;box-shadow:inset 0 0 0 2px #9DB6F2}
.week .wd.now{color:var(--tide-deep)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--lift);padding:16px 18px 20px}
.tabs{display:flex;gap:4px;background:var(--paper-2);padding:5px;border-radius:999px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;font-weight:600;color:var(--ink-2);padding:9px 6px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;position:relative;transition:background .2s,color .2s}
.tab svg{width:17px;height:17px}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 10px -2px rgba(91,122,211,.3)}
.tab .badge{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--shell-deep)}
.view[hidden]{display:none}
h2{font-size:21px;margin:0 0 4px;font-weight:700}
h3{font-size:16px;margin:18px 0 8px;font-weight:700}
.muted{color:var(--ink-2)}.small{font-size:13.5px}
.datechips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.dchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.dchip[aria-pressed="true"]{background:var(--foam);border-color:#BFDDF2;color:var(--ink)}
.dchip .s{font-weight:500;font-size:12.5px;color:var(--ink-3);margin-left:4px}
.taglist{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--paper-2);color:var(--ink-2)}
.tag.t-TEST{background:#E6E3F7;color:#4B3E92}.tag.t-MOCK{background:#DCD6F5;color:#3E2F7E}
.tag.t-REST,.tag.t-OFF{background:#EEF0F6}.tag.t-STUDY5,.tag.t-STUDY4{background:var(--foam);color:#2D5D8C}
.tag.t-LIGHT2,.tag.t-LIGHT3,.tag.t-EXAMS{background:var(--mint);color:#24694F}
.tag.t-TAPER3,.tag.t-TAPER1{background:var(--butter);color:#7A5A0B}.tag.t-EXAM{background:var(--shell);color:#8A2F4B}
.plan{background:var(--foam);border-radius:var(--r-m);padding:13px 15px;font-size:14.5px;line-height:1.55}
.plan b{font-weight:700}
.plan .rev{margin-top:8px;padding-top:8px;border-top:1px dashed #BCD9EE;color:var(--ink-2)}
.plan .note{margin-top:8px;font-size:13px;color:#5B4BA8;background:#EEEAFB;border-radius:10px;padding:6px 10px}
.blocks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.block{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 14px;border-radius:16px;background:var(--paper-2);flex-wrap:wrap}
.block .bl{font-weight:700;font-size:15px}.block .bm{font-weight:500;color:var(--ink-3);font-size:13px;margin-left:6px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink-3);
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .18s,color .18s}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--mint);color:var(--mint-deep)}
.seg button[aria-pressed="true"][data-v="partly"]{background:var(--butter);color:var(--butter-deep)}
.seg button[aria-pressed="true"][data-v="missed"]{background:var(--peach);color:var(--peach-deep)}
label.fl{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
textarea,input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 13px;font-size:15px;font-weight:500;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:#9DB6F2;box-shadow:0 0 0 4px rgba(157,182,242,.25)}
.score{display:flex;gap:10px;align-items:center}.score input{max-width:120px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px}
.btn-main{background:var(--tide-deep);color:#fff;box-shadow:0 10px 22px -10px rgba(91,122,211,.9)}
.btn-main:hover:not(:disabled){transform:translateY(-1px);background:#4F6DC6}
.btn-main:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-soft{background:var(--paper-2);color:var(--ink);border:1px solid var(--line)}
.btn-soft:hover{background:#EBEEFA}
.btn-small{padding:7px 14px;font-size:13.5px}
.hint{font-size:13.5px;color:var(--ink-3)}
.intent{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-top:12px}
.intent svg{width:16px;height:16px;flex:none;color:var(--tide-deep)}
.saved{display:flex;gap:8px;align-items:center;background:var(--mint);color:var(--mint-deep);border-radius:14px;padding:9px 13px;font-weight:600;font-size:14px;margin-top:12px}
.saved svg{width:17px;height:17px}
.catch{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.citem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.citem:last-child{border-bottom:0}
.empty{background:var(--paper-2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.calhead h2{font-size:19px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:16px;height:16px}.iconbtn:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.grid .dow{font-size:12.5px;color:var(--ink-3);font-weight:700;padding-bottom:2px}
.day{aspect-ratio:1;border:0;border-radius:14px;background:var(--paper-2);cursor:pointer;position:relative;font-weight:700;font-size:14px;color:var(--ink-2);display:grid;place-items:center;padding:0}
.day.out{visibility:hidden}
.day.none{background:transparent;color:#C5C9DA;cursor:default}
.day.done{background:#D9EEFB;color:#2D5D8C}
.day.missed{background:#fff;box-shadow:inset 0 0 0 2px #F3B9A3;color:var(--peach-deep)}
.day.rest{background:#F1EEFA;color:#8B80B8}
.day.open{background:#fff;box-shadow:inset 0 0 0 2px #9DB6F2;color:var(--ink)}
.day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--tide-deep)}
.day.test{font-style:normal}
.day .mk{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:#B9A9EE}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px}
/* reef */
.reefgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rcard{border-radius:16px;background:var(--paper-2);padding:10px 12px;display:flex;gap:10px;align-items:center}
.rcard svg{width:44px;height:44px;flex:none}
.rcard .rn{font-weight:700;font-size:14px;line-height:1.25}.rcard .rs{font-size:12.5px;color:var(--ink-3)}
.rcard.grown{background:#EEF8F3}
.rcard.locked svg{opacity:.28;filter:grayscale(1)}
.mem{background:#F4F1FB;border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:8px}
.notecard{background:#FFF8EE;border-radius:16px;padding:12px 14px;font-size:14.5px;margin-bottom:8px;border:1px solid #F6E3C6}
.notecard .nd{font-size:12.5px;color:#9A7A4A;font-weight:700;margin-bottom:2px}
/* settings */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--tide-deep)}
code.bk{display:block;word-break:break-all;font-family:inherit;font-size:12px;background:var(--paper-2);border-radius:12px;padding:10px;max-height:90px;overflow:auto;color:var(--ink-2)}
/* dialogs */
dialog{border:0;border-radius:28px;padding:0;max-width:min(520px,92vw);width:100%;box-shadow:0 30px 80px -20px rgba(54,64,106,.5);color:var(--ink)}
dialog::backdrop{background:rgba(54,64,106,.28);backdrop-filter:blur(3px)}
.dlg{padding:24px 24px 22px}
.dlg h2{font-size:23px}
.dlg .art{display:grid;place-items:center;margin:-4px 0 6px}
.dlg .art svg{max-width:170px;height:auto}
.dlg .actions{justify-content:flex-end}
.foot{text-align:center;color:var(--ink-3);font-size:13.5px;margin-top:26px}
.noscript,.storewarn{background:#FFF4E8;border:1px solid #F5D3AE;color:#8A4A1C;border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:600}
/* preview bar (only with ?preview) */
.pbar{position:relative;margin:10px 12px 0;z-index:50;background:#2F375C;color:#fff;border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;box-shadow:0 16px 40px -10px rgba(0,0,0,.4)}
.pbar input,.pbar select{width:auto;padding:6px 10px;border-radius:10px;border:0;font-size:13.5px;color:var(--ink)}
.pbar button{border:0;border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer;background:#fff;color:#2F375C}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}.stage{position:relative;top:0}
}
@media (max-width:560px){
  .app{padding:14px 12px 28px}.brand h1{font-size:26px}.tank{border-width:5px;border-radius:26px}
  .status{font-size:14.5px;padding:10px 14px}
  .tab{font-size:13.5px;padding:9px 2px}.tab svg{display:none}.tab .badge{right:6px}
  .block{padding:9px 10px}.seg button{padding:6px 9px}
  .row2{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(7,1fr)}.week .wl{grid-column:1/-1}.week .wd{min-width:0}
}
.twk{animation:twk 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.twk.t2{animation-delay:1.2s}.twk.t3{animation-delay:2.3s}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <noscript><div class="noscript">Ammu Tides needs JavaScript turned on in Chrome.</div></noscript>
  <div class="storewarn" id="storeWarn" hidden>This browser is blocking saved data, so check-ins would be lost. Open the page in a normal Chrome window, not incognito.</div>
  <header class="top">
    <div class="brand">
      <svg id="brandWhale" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <div><h1>Ammu Tides</h1><p>Study, then feed the tide.</p></div>
    </div>
    <div class="countdown" id="countdown"></div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Your tide">
      <div class="tank" id="tank">
        <svg id="scene" viewBox="0 0 1000 640" role="img" aria-labelledby="sceneTitle">
          <title id="sceneTitle">Your whale's tide</title>
          <defs>
            <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4DDF8"/><stop offset=".6" stop-color="#EEEAFA"/><stop offset="1" stop-color="#F0F5FC"/></linearGradient>
            <filter id="fSoft" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
            <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE5F6"/><stop offset=".55" stop-color="#92C4EC"/><stop offset="1" stop-color="#7BA7DE"/></linearGradient>
            <linearGradient id="gWaterBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7EFFA"/><stop offset="1" stop-color="#A8CFEF"/></linearGradient>
            <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E8CF"/><stop offset="1" stop-color="#EED6B3"/></linearGradient>
            <linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <radialGradient id="gEgg" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F3E6D3"/></radialGradient>
            <linearGradient id="gWhale" gradientUnits="userSpaceOnUse" x1="0" y1="-78" x2="0" y2="66"><stop id="wg1" offset="0" stop-color="#7F9BE6"/><stop id="wg2" offset=".55" stop-color="#9DB5F0"/><stop id="wg3" offset="1" stop-color="#BCCDF6"/></linearGradient>
            <linearGradient id="gBelly" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="64"><stop offset="0" stop-color="#F6F8FF"/><stop offset="1" stop-color="#DCE5FB"/></linearGradient>
            <radialGradient id="gShine"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <filter id="fShadow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
            <clipPath id="clipWater"><path id="waterClipPath" d=""/></clipPath>
          </defs>
          <rect width="1000" height="640" fill="url(#gSky)"/>
          <g id="sky"><circle cx="872" cy="76" r="58" fill="#FFF3D4" opacity=".55"/><path d="M886,46 A32,32 0 1 0 886,106 A25,25 0 1 1 886,46 Z" fill="#FFE7A6"/>
            <path class="twk" d="M712,52 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z" fill="#FFFFFF"/><path class="twk t2" d="M780,118 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 z" fill="#FFF7E0"/>
            <path class="twk t3" d="M640,92 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2 z" fill="#FFFFFF"/><path class="twk t2" d="M120,64 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 z" fill="#FFFFFF"/></g>
          <path id="waveBack" fill="url(#gWaterBack)" d=""/>
          <path id="waveFront" fill="url(#gWater)" d=""/>
          <g clip-path="url(#clipWater)">
            <g id="rays" filter="url(#fSoft)"></g>
            <g id="grassBg"></g>
            <g id="friends"></g>
            <g id="bubbles"></g>
            <g id="whaleWrap" style="cursor:pointer"><g id="whale"></g></g>
            <g id="eggWrap"></g>
            <rect id="haze" x="0" y="0" width="1000" height="640" fill="#C9C2B4" opacity="0" pointer-events="none"/>
          </g>
          <path id="sand" d="M0,566 C120,552 240,576 380,562 C520,550 640,575 780,561 C880,552 950,567 1000,560 L1000,640 L0,640 Z" fill="url(#gSand)"/>
          <ellipse id="wShadow" cx="500" cy="578" rx="80" ry="8" fill="#C9AE86" opacity="0" filter="url(#fShadow)"/>
          <g id="pebbles"></g>

/* ---------- dates (always local time on her laptop) ---------- */
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const fmt = s => { const d = parse(s); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const deadline = s => { const d = parse(s); d.setDate(d.getDate() + 1); d.setHours(12, 0, 0, 0); return d; };
let pretend = PREVIEW && PARAMS.get("now") ? new Date(PARAMS.get("now")) : null;
const now = () => pretend ? new Date(pretend.getTime()) : new Date();

/* ---------- storage ---------- */
let storageOK = true;
function blank() { return { v: 1, whales: [], checkins: {}, examDate: null, calm: false, lastBackup: null, ackDeaths: 0, seenNotes: [], seenCoral: [], seenFriends: [] }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw); return Object.assign(blank(), d);
  } catch (e) {
    try { const prev = localStorage.getItem(KEY + "-prev"); if (prev) return Object.assign(blank(), JSON.parse(prev)); } catch (e2) {}
    return blank();
  }
}
function save() {
  try {

    if (cur) localStorage.setItem(KEY + "-prev", cur);
    localStorage.setItem(KEY, JSON.stringify(db));

}

/* ---------- plan schedule, including the extension rule from page 3 of the plan ---------- */
const BASE = new Map(DAYS.map(r => [r.d, r]));
const REST_ROW = d => ({ d, t: "REST", tag: "REST", main: "Rest day. Only if you missed a day this week: redo its Learn block (max 2 h).", rev: "", b: [], fp: [] });
const EXAM_ROW = d => ({ d, t: "EXAM", tag: "GATE", main: "Your GATE CS exam day. Carry your admit card and ID, breathe slowly, and trust the work you have done.", rev: "", b: [], fp: [] });
const MOCK7_ROW = d => { const m = BASE.get("2027-01-09"); return { d, t: "MOCK", tag: "MOCK 5h", main: "Mock 180 (9:30 AM to 12:30 PM) + Check 120 (2:00 to 4:00 PM): Mock 7.", rev: "", b: m.b, fp: [], note: "Extension rule for a 13 or 14 Feb exam: Mock 7." }; };
function copyFrom(d, src, note) { const r = BASE.get(src); return Object.assign({}, r, { d, fp: [], note: note + (r.main.indexOf("latest mock") >= 0 ? " Your latest mock means your most recent one." : "") }); }
function schedule() {
  const ex = db.examDate || "2027-02-06";
  const m = new Map(BASE);
  const rule = s => "Extension rule (page 3): this is the " + fmt(s) + " plan.";
  const sundayRule = (d, exam) => { m.set(d, copyFrom(d, "2027-02-05", "Your exam is on Sunday, so today repeats the Fri 5 Feb plan.")); m.set(exam, EXAM_ROW(exam)); };
  if (ex === "2027-02-06") m.set("2027-02-06", Object.assign({}, BASE.get("2027-02-06"), { t: "EXAM", tag: "GATE?" }));
  if (ex === "2027-02-07") sundayRule("2027-02-06", "2027-02-07");
  if (ex === "2027-02-13" || ex === "2027-02-14") {
    [["2027-02-02","2027-01-25"],["2027-02-03","2027-01-26"],["2027-02-04","2027-01-28"],["2027-02-05","2027-01-29"]].forEach(([d, s]) => m.set(d, copyFrom(d, s, rule(s))));
    m.set("2027-02-06", MOCK7_ROW("2027-02-06")); m.set("2027-02-07", REST_ROW("2027-02-07"));
    m.set("2027-02-08", copyFrom("2027-02-08", "2027-02-01", "Extension rule (page 3): dress-rehearsal mock, the Mon 1 Feb plan."));
    [["2027-02-09","2027-02-02"],["2027-02-10","2027-02-03"],["2027-02-11","2027-02-04"],["2027-02-12","2027-02-05"]].forEach(([d, s]) => m.set(d, copyFrom(d, s, "Extension rule (page 3): taper day, the " + fmt(s) + " plan.")));
    if (ex === "2027-02-13") m.set("2027-02-13", EXAM_ROW("2027-02-13")); else sundayRule("2027-02-13", "2027-02-14");
  }
  if (ex === "2027-02-20" || ex === "2027-02-21") {
    for (let w = 0; w < 2; w++) for (let i = 0; i < 7; i++) {
      const d = addDays("2027-02-01", w * 7 + i), s = addDays("2027-01-25", i);
      const src = BASE.get(s);
      m.set(d, src.t === "REST" ? REST_ROW(d) : copyFrom(d, s, rule(s) + (src.t === "MOCK" ? " Treat it as your next full mock." : "")));
    }
    m.set("2027-02-15", copyFrom("2027-02-15", "2027-02-01", "Extension rule (page 3): dress-rehearsal mock, the Mon 1 Feb plan."));
    [["2027-02-16","2027-02-02"],["2027-02-17","2027-02-03"],["2027-02-18","2027-02-04"],["2027-02-19","2027-02-05"]].forEach(([d, s]) => m.set(d, copyFrom(d, s, "Extension rule (page 3): taper day, the " + fmt(s) + " plan.")));
    if (ex === "2027-02-20") m.set("2027-02-20", EXAM_ROW("2027-02-20")); else sundayRule("2027-02-20", "2027-02-21");
  }
  return { map: m, exam: ex };
}
const isStudyDay = r => !!r && ["REST", "OFF", "EXAM"].indexOf(r.t) < 0;

function phaseOf(d) {
  if (d < "2026-10-01") return "";
  if (d >= "2026-11-16" && d <= "2026-12-14") return "Phase 1: first pass, college exam season";

/* ---------- the tide engine: replays every day from the start ---------- */
const SUBJECTS = [
  ["C","C Programming"],["DS","Data Structures"],["DM","Discrete Mathematics"],["LA","Linear Algebra"],["CA","Calculus"],
  ["PR","Probability and Statistics"],["AL","Algorithms"],["TC","Theory of Computation"],["DL","Digital Logic"],["CD","Compiler Design"],
  ["CO","Computer Organization"],["DB","Databases"],["OS","Operating System"],["CN","Computer Networks"]];
function compute() {
  const S = schedule(), t = now(), today = iso(t);
  const st = { phase: "alive", whale: 0, missed: 0, swim: 0, streak: 0, best: 0, egg: 0, total: 0, memorials: [], hatched: [START],
               friends: {}, missedDays: [], before: today < START, today, exam: S.exam, sched: S.map, ended: false };
  const end = addDays(S.exam, -1);
  if (today > S.exam) st.ended = true;
  for (let d = START; d <= today && d <= end; d = addDays(d, 1)) {
    const row = S.map.get(d), ci = db.checkins[d], study = isStudyDay(row);
    if (ci) {
      st.total++;
      if (study) { st.streak++; st.best = Math.max(st.best, st.streak); }
      if (st.phase === "alive") { st.missed = 0; st.swim++; }
      else { st.egg++; st.missed = 0; if (st.egg >= HATCH_AFTER) { st.phase = "alive"; st.whale++; st.swim = 0; st.egg = 0; st.hatched[st.whale] = d; } }
      if (st.streak >= 7 && !st.friends.fish) st.friends.fish = d;
      if (st.streak >= 21 && !st.friends.turtle) st.friends.turtle = d;
      if (d >= "2027-01-08" && !st.friends.dolphin) st.friends.dolphin = d;
    } else if (study && t > deadline(d)) {
      st.missed++; st.streak = 0; st.missedDays.push(d);
      if (st.phase === "alive" && st.missed >= DIE_AFTER) {
        st.memorials.push({ whale: st.whale, days: st.swim, from: st.hatched[st.whale], to: d });
        st.phase = "egg"; st.egg = 0; st.missed = 0;
      } else if (st.phase === "egg") st.egg = 0;
    }
  }
  // reef: a subject grows when every first-pass day is checked in as Done or Partly (or caught up)
  st.reef = {};
  const fpBy = {};
  for (const r of DAYS) for (const f of r.fp) (fpBy[f.s] = fpBy[f.s] || []).push([r.d, f.b]);
  for (const [k] of SUBJECTS) {
    const list = fpBy[k] || []; let ok = 0;
    for (const [d, b] of list) {
      if (d < START) { ok++; continue; }
      const ci = db.checkins[d], v = ci && ci.blocks && ci.blocks[b];
      if (v === "done" || v === "partly" || (ci && ci.caught && ci.caught[b])) ok++;
    }
    st.reef[k] = { ok, n: list.length, grown: list.length > 0 && ok === list.length, last: list.length ? list[list.length - 1][0] : null };
  }
  st.grownCount = Object.values(st.reef).filter(x => x.grown).length;
  st.mood = st.phase === "egg" ? "egg" : st.before ? "happy" : ["happy", "happy", "glance", "sad", "struggle"][Math.min(st.missed, 4)];
  st.level = st.phase === "egg" ? 0.2 + st.egg * 0.16 : { happy: 0.83, glance: 0.67, sad: 0.5, struggle: 0.33 }[st.mood];
  st.haze = st.phase === "egg" ? 0.1 : { happy: 0, glance: 0.06, sad: 0.15, struggle: 0.26 }[st.mood];
  st.whaleName = (db.whales[st.whale] && db.whales[st.whale].name) || "";
  return st;
}

/* ---------- which days can be checked in right now ---------- */
function openDays(st) {
  const t = now(), today = iso(t), y = addDays(today, -1), out = [];
  const last = addDays(st.exam, -1);
  if (y >= START && y <= last && t < deadline(y)) out.push(y);
  if (today >= START && today <= last) out.push(today);
  return out;
}

/* ---------- helpers ---------- */

}

function renderChips() {

/* ---------- Tonight ---------- */
function defaultDay(open) {
  if (!open.length) return null;
  if (selDay && open.indexOf(selDay) >= 0) return selDay;
  const today = ST.today, y = addDays(today, -1);
  if (open.indexOf(y) >= 0 && !db.checkins[y] && isStudyDay(ST.sched.get(y)) && now().getHours() < 12) return y;
  return open[open.length - 1];
}
function renderTonight() {
  const v = $("v-tonight"); const open = openDays(ST);
  if (ST.ended) { v.innerHTML = `<h2>You made it</h2><p class="muted">Every check-in is saved in your calendar. Wishing you a calm, clear exam.</p>`; return; }
  if (!open.length && ST.today === ST.exam) { v.innerHTML = `<h2>GATE day</h2><p class="muted">No check-in today. Carry your admit card and ID, breathe slowly, and trust the work you have done.</p>${dayPlanHTML(ST.sched.get(ST.today))}`; return; }

    v.innerHTML = `<h2>Your tide starts ${fmt(START)}</h2><p class="muted">Check-ins open on ${fmt(START)} by this device's clock. Here is the plan for that day.</p>${dayPlanHTML(r)}
      <div class="actions"><button class="btn btn-soft" id="tryPractice">${I.drop}Try practice mode</button></div><p class="hint">Practice mode uses a pretend date and separate data, so the real tide is never touched.</p>`;

  const chips = open.map(d => `<button class="dchip" data-day="${d}" aria-pressed="${d === selDay}">${dlabel(d)}, ${fmt(d)}${d !== ST.today ? '<span class="s">open till noon</span>' : ""}${db.checkins[d] ? '<span class="s">checked in</span>' : ""}</button>`).join("");
  const dr = drafts[selDay] || (drafts[selDay] = ci ? JSON.parse(JSON.stringify(ci)) : { blocks: {}, recall: "", note: "", score: "" });
  let html = `<h2>${selDay === ST.today ? "Tonight's check-in" : "Yesterday's check-in"}</h2>

      r.b.map(b => `<div class="block"><div><span class="bl">${esc(b.l)}</span><span class="bm">${b.m} min</span></div>
        <div class="seg" role="group" aria-label="${esc(b.l)}">${["done", "partly", "missed"].map(val =>
          `<button type="button" data-k="${b.k}" data-v="${val}" aria-pressed="${dr.blocks[b.k] === val}">${val === "done" ? I.check + "Done" : val === "partly" ? I.half + "Partly" : I.cross + "Missed"}</button>`).join("")}</div></div>`).join("") + `</div>`;
    if (r.t === "TEST") html += `<label class="fl" for="score">Test score <span class="muted small">(optional, in %)</span></label><div class="score"><input id="score" type="number" min="0" max="100" step="1" value="${esc(dr.score)}"></div>`;

    html += `<label class="fl" for="recall">One thing you remember, without looking</label>

function refreshFeed(r, dr) { const ok = formReady(r, dr); $("feed").disabled = !ok; const h = $("feedHint"); if (h && ok && h.textContent.indexOf("Mark every") === 0) h.textContent = ""; if (h && !ok) h.textContent = "Mark every block and write one line from memory."; }

const MSGS = [

function submit(d, r, dr) {

/* ---------- catch-up list ---------- */
function catchList() {
  const out = [];
  Object.keys(db.checkins).sort().forEach(d => {
    const ci = db.checkins[d], row = schedule().map.get(d); if (!row) return;
    row.b.forEach(b => { if (ci.blocks && ci.blocks[b.k] === "missed" && !(ci.caught && ci.caught[b.k])) out.push({ d, k: b.k, l: b.l, m: b.m }); });

}
function catchHTML() {
  const L = catchList();

    L.map(x => `<div class="citem"><span><b>${esc(x.l)}</b> ${x.m} min <span class="muted">from ${fmt(x.d)}</span></span><button class="btn btn-soft btn-small" data-cd="${x.d}" data-ck="${x.k}">${I.check}Caught up</button></div>`).join("")

/* ---------- Calendar ---------- */
function monthsRange() { const out = []; let m = "2026-10"; const last = ST.exam.slice(0, 7); while (m <= last) { out.push(m); const [y, mo] = m.split("-").map(Number); m = mo === 12 ? (y + 1) + "-01" : y + "-" + pad(mo + 1); } return out; }
function renderCalendar() {

  const [y, mo] = calMonth.split("-").map(Number), first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday first
  const open = openDays(ST), missed = new Set(ST.missedDays);

    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:#D9EEFB"></i>Checked in</span><span><i style="box-shadow:inset 0 0 0 2px #F3B9A3;background:#fff"></i>Missed</span>
    <span><i style="background:#F1EEFA"></i>Rest day</span><span><i style="box-shadow:inset 0 0 0 2px #9DB6F2;background:#fff"></i>Open to check in</span>

    <p class="hint" style="margin-top:12px">Tap any day to see its plan. You can check in for today, and for yesterday until noon.</p>`;
  $("calPrev").onclick = () => { calMonth = months[i - 1]; renderCalendar(); };
  $("calNext").onclick = () => { calMonth = months[i + 1]; renderCalendar(); };

}
function showDay(d) {

function restore(text) {
