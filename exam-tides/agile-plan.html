<style>
.pl{max-width:700px;margin:0 auto;padding:0 16px 120px}
.pl-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;min-height:58px;margin:0 -16px;padding:0 130px 0 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tt{right:16px!important;top:10px!important}
.pl-back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--ink-2);text-decoration:none}
.pl-back svg{width:18px;height:18px}

/* hero + exam clock */
.pl-hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:24px 0 18px}
.pl-hero h1{font:400 clamp(38px,10vw,56px)/1.02 var(--display);letter-spacing:-.02em}
.pl-hero p{margin:10px 0 0;color:var(--ink-2);font-size:16px;line-height:1.5}
.pl-clock{width:132px;display:grid;justify-items:center;gap:6px}
.pl-clock svg{width:132px;height:132px;display:block;overflow:visible}
.ck-track{fill:none;stroke:var(--surface-2);stroke-width:7}
.ck-ring{fill:none;stroke:var(--tide);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ck-bowl{fill:var(--surface)}
.ck-water{fill:var(--water);opacity:.55}
.ck-water2{fill:var(--tide);opacity:.28}
.ck-num{font:700 26px var(--mono);fill:var(--ink);letter-spacing:-.02em}
.ck-unit{font:600 11px var(--font);fill:var(--ink-2)}
.ck-whale .w-body{fill:var(--tide)}
.ck-whale .w-belly{fill:var(--surface)}
.ck-whale .w-eye{fill:var(--ink)}
.ck-whale .w-shine{fill:#fff}
.ck-whale .w-cheek{fill:#F4A29E}
.ck-wave{animation:ckwave 6s linear infinite}
.ck-wave2{animation:ckwave 9s linear infinite reverse}
.ck-bob{animation:ckbob 3.2s ease-in-out infinite}
@keyframes ckwave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes ckbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){.ck-wave,.ck-wave2,.ck-bob{animation:none}}
.pl-clock small{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.3}

/* progress + now */
.pl-prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px 14px;margin:0 0 12px}
.pl-prog-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pl-prog-h b{font-size:16px}
.pl-prog-h span{font:600 13.5px var(--mono);color:var(--muted)}
.pl-units{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.pl-u{display:grid;gap:6px}
.pl-u i{display:block;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pl-u i b{display:block;height:100%;width:0;background:var(--tide);border-radius:99px;transition:width .3s}
.pl-u.full i b{background:var(--good)}
.pl-u small{font-size:12.5px;color:var(--muted);font-weight:600}
.pl-u.full small{color:var(--good)}
.pl-now{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:15px 18px 16px;margin:0 0 8px;display:grid;gap:3px}
:root[data-theme="night"] .pl-now{background:var(--tide-soft);color:var(--ink)}
.pl-now small{font-size:13px;font-weight:600;opacity:.75}
.pl-now strong{font-size:19px;line-height:1.25}
.pl-now em{font-style:normal;font-size:14.5px;opacity:.85;line-height:1.45}
.pl-now button{justify-self:start;margin-top:9px;border:0;border-radius:11px;padding:8px 14px;font-weight:700;font-size:14.5px;background:var(--bg);color:var(--ink)}
:root[data-theme="night"] .pl-now button{background:var(--tide);color:#04171b}

/* day heading */
.pl-day{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pl-day h2{font:400 30px/1.1 var(--display)}
.pl-day span{font-size:14px;color:var(--muted);font-weight:600}

/* rows */
.pl-list{display:grid;gap:10px}
.pl-row{display:grid;grid-template-columns:58px 1fr;gap:0 12px;align-items:start;scroll-margin-top:76px}
.pl-time{padding-top:16px;text-align:right;font:600 14px/1.2 var(--mono);color:var(--ink-2)}
.pl-time small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);font-weight:400}
.pl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;transition:border-color .2s,background .2s}
.pl-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 14px 12px 16px}
.pl-kind{font-size:13px;font-weight:600;color:var(--muted)}
.pl-card h3{font-size:18px;margin-top:3px;line-height:1.25}
.pl-tick{width:36px;height:36px;border-radius:11px;border:1.6px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;flex:none}
.pl-tick svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}

/* topic list inside a card */
.pl-topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pl-topics li + li{border-top:1px solid var(--line)}
.pl-topics a{display:grid;grid-template-columns:22px 1fr 16px;gap:8px;align-items:center;padding:10px 14px 10px 16px;color:var(--ink);text-decoration:none;font-size:15.5px;line-height:1.35}
.pl-topics a:hover{background:var(--sunk)}
.pl-topics a:active{background:var(--surface-2)}
.pl-topics .n{font:600 12.5px var(--mono);color:var(--muted)}
.pl-topics .go{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-topics small{display:block;font-size:12.5px;color:var(--muted)}
.pl-topics .vis .n svg{width:16px;height:16px;stroke:var(--tide);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.pl-topics .vis a > span:nth-child(2){color:var(--tide-deep);font-weight:600}
:root[data-theme="night"] .pl-topics .vis a > span:nth-child(2){color:var(--tide)}

.pl-body{padding:12px 16px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.pl-body p{margin:0}
.pl-body ol{margin:6px 0 0;padding-left:20px}
.pl-body li{margin:3px 0}
.pl-recall{margin:0;padding:12px 16px 0;border-top:1px solid var(--line)}
.pl-recall b{display:block;font-size:13px;font-weight:700;color:var(--amber);margin-bottom:3px}
.pl-recall p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.pl-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 14px}
.pl-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14.5px;color:var(--ink-2);text-decoration:none}
.pl-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pl-btn.run.on{border-color:var(--tide);color:var(--tide-deep);background:var(--tide-soft)}

/* states */
.pl-row.done .pl-tick{background:var(--good);border-color:var(--good)}
.pl-row.done .pl-tick svg{opacity:1}
.pl-row.done .pl-card{background:var(--sunk)}
.pl-row.done .pl-card h3{color:var(--ink-2)}
.pl-row.done .pl-topics,.pl-row.done .pl-body,.pl-row.done .pl-recall,.pl-row.done .pl-foot{display:none}
.pl-row.now .pl-card{border-color:var(--tide);box-shadow:0 0 0 3px var(--tide-soft)}
.pl-row.now .pl-time{color:var(--tide)}

/* breaks, meals */
.pl-row.brk{margin:-2px 0}
.pl-row.brk .pl-time{padding-top:3px;font-size:12.5px;color:var(--muted)}
.pl-brk{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);padding:2px 0}
.pl-brk::before,.pl-brk::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.pl-brk::before{flex:0 0 10px}
.pl-row.brk.now .pl-brk{color:var(--tide);font-weight:700}
.pl-row.soft .pl-card{background:transparent;border-style:dashed}
.pl-row.soft .pl-head{padding:12px 14px 12px 16px}
.pl-row.soft h3{font-size:16px}
.pl-row.soft .pl-sub{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.45}
.pl-row.big.open .pl-card{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.pl-row.big.open .pl-sub{color:var(--good);font-weight:600}
.pl-row.end .pl-card{background:transparent;border:0}
.pl-row.end .pl-head{padding:12px 0}

.pl-notes{margin-top:30px;display:grid;gap:10px}
.pl-note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15px;color:var(--ink-2);line-height:1.5}
.pl-note b{color:var(--ink)}
.pl-note summary{font-weight:700;color:var(--ink);cursor:pointer}
.pl-note ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.pl-reset{justify-self:center;border:0;background:none;color:var(--muted);font-size:13.5px;text-decoration:underline;padding:6px}

@media(max-width:400px){
  .pl-row{grid-template-columns:48px 1fr;gap:0 8px}
  .pl-time{font-size:13px}
  .pl-clock{width:112px}.pl-clock svg{width:112px;height:112px}
  .pl-hero{gap:10px}
}
</style>
</head>

try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

const mins = (a, b) => { const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number); return (h2 * 60 + m2) - (h1 * 60 + m1); };
const twelve = s => { let [h, m] = s.split(":").map(Number); h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")}`; };
const ampm = s => `${twelve(s)} ${+s.split(":")[0] >= 12 ? "PM" : "AM"}`;
const ist = (d, s) => new Date(`${d}T${s}:00+05:30`).getTime();
const href = k => k.startsWith("g:") ? `agile-guide.html#g-${k.slice(2)}` : `index.html#agile:${k}`;
const linkHref = l => l.startsWith("guide:") ? `agile-guide.html${l.length > 6 ? "#" + l.slice(6) : ""}` : l.startsWith("app:") ? `${APP}${l.slice(4)}` : `${APP}${l}`;
const SV = {
  tick: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9.5 3h5"/></svg>',
  go: '<svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>',
  open: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5H5V6h5"/></svg>'
};
const WHALE = `<g class="ck-whale"><path class="w-body" d="M9.5 21 3 15.5c3.2-.2 6 1.4 7.6 3.8zM9.5 22.5 4 28.5c3.1.4 5.9-1 7.4-3.6z"/><path class="w-body" d="M8.5 22.5c0-8.3 7.6-13.5 17-13.5 8.6 0 15 5 15 12.5S33.9 33.5 24.5 33.5H15.5c-4 0-7-4.6-7-11z"/><path class="w-belly" d="M13.5 27.5c3 3.4 7 4.8 12 4.8 6 0 10.4-2.3 12.8-6.3-3.4 1.8-7.8 2.7-12.6 2.7-4.6 0-8.6-.4-12.2-1.2z"/><circle class="w-eye" cx="31.5" cy="19.5" r="1.7"/><circle class="w-shine" cx="32.1" cy="18.9" r=".5"/><ellipse class="w-cheek" cx="34" cy="23.6" rx="2.1" ry="1.2"/></g>`;

const unitLists = [1, 2, 3, 4, 5].map(u => STUDY.filter(x => x.u === u));
const today = STUDY.filter(x => x.d === D1);

function timeCol(x, showDur) {
  const dur = x.e ? mins(x.s, x.e) : 0;
  return `<div class="pl-time">${twelve(x.s)}${showDur && dur ? `<small>${dur} min</small>` : ""}</div>`;
}
function rowHTML(x, i) {
  const dur = x.e ? mins(x.s, x.e) : 0;
  if (x.k === "b") return `<div class="pl-row brk" data-i="${i}">${timeCol(x)}<div class="pl-brk">Break, ${dur} min</div></div>`;
  if (x.k === "B") return `<div class="pl-row soft big" data-i="${i}">${timeCol(x, 1)}<div class="pl-card"><div class="pl-head"><div><h3>${x.t}</h3><div class="pl-sub">${x.lock}</div></div></div></div></div>`;
  if (x.k === "m" || x.k === "e") return `<div class="pl-row soft ${x.k === "e" ? "end" : ""}" data-i="${i}">${timeCol(x, 1)}<div class="pl-card"><div class="pl-head"><div><h3>${x.t}</h3><div class="pl-sub">${x.sub}</div></div></div></div></div>`;
  let n = 0;
  const topics = x.topics ? `<ul class="pl-topics">${x.topics.map(t => t.vis
      ? `<li class="vis"><a href="${href(t.key)}"><span class="n">${SV.eye}</span><span>${t.name}</span>${SV.go}</a></li>`
      : `<li><a href="${href(t.key)}"><span class="n">${++n}</span><span>${t.name}${t.sub ? `<small>${t.sub}</small>` : ""}</span>${SV.go}</a></li>`).join("")}</ul>` : "";
  const body = x.body ? `<div class="pl-body"><p>${x.body}</p></div>` : "";
  const recall = x.recall ? `<div class="pl-recall"><b>Last 5 minutes, book closed</b><p>${x.recall}</p></div>` : "";
  const link = x.link ? `<a class="pl-btn" href="${linkHref(x.link[1])}">${SV.open}${x.link[0]}</a>` : "";
  return `<div class="pl-row" data-i="${i}" data-id="${x.id}">${timeCol(x, 1)}<div class="pl-card">
    <div class="pl-head"><div><div class="pl-kind">${x.kind}</div><h3>${x.t}</h3></div>
    <button class="pl-tick" type="button" data-tick="${x.id}" aria-pressed="false" aria-label="Mark done: ${x.t}">${SV.tick}</button></div>
    ${topics}${body}${recall}
    <div class="pl-foot"><button class="pl-btn run" type="button" data-run="${dur}">${SV.clock}${dur}-min timer</button>${link}</div>
  </div></div>`;
}

const root = document.getElementById("plan");
root.innerHTML = `
  <div class="pl-top"><a class="pl-back" href="${APP}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Agile in Exam Tides</a></div>
  <header class="pl-hero">
    <div><h1>Agile in one day</h1><p>The whole syllabus in order, unit by unit, from the complete answers. Each part ends with writing from memory.</p><a class="pl-btn" style="margin-top:12px" href="agile-guide.html"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>All answers</a></div>
    <div class="pl-clock" id="clock" role="img"></div>
  </header>
  <section class="pl-prog" aria-label="Progress">
    <div class="pl-prog-h"><b>Syllabus covered</b><span id="pcount"></span></div>
    <div class="pl-units">${[1, 2, 3, 4, 5].map(u => `<div class="pl-u" data-u="${u}"><i><b></b></i><small>Unit ${u}</small></div>`).join("")}</div>
  </section>
  <section class="pl-now" id="now" aria-live="polite"></section>
  <div class="pl-day"><h2>Tuesday</h2><span>24 Nov · times in IST</span></div>
  <div class="pl-list">${P.map((x, i) => x.d === D1 ? rowHTML(x, i) : "").join("")}</div>
  <div class="pl-day"><h2>Wednesday, exam day</h2><span>25 Nov · paper at 2:00 PM</span></div>
  <div class="pl-list">${P.map((x, i) => x.d === D2 ? rowHTML(x, i) : "").join("")}</div>
  <div class="pl-notes">
    <div class="pl-note"><b>Running late?</b> Keep the order and the book-closed minutes. Shorten lunch, tea and dinner first; never skip a unit.</div>
    <details class="pl-note"><summary>Why the day is built this way</summary><ul>
      <li><b>Blank page first.</b> Trying to answer before studying makes the later reading stick, even when the guesses are wrong.</li>
      <li><b>25-minute parts with one clear target.</b> A small, defined task is easier to start and easier to stay with.</li>
      <li><b>Book closed at the end of each part.</b> Pulling facts out of memory strengthens them far more than reading again.</li>
      <li><b>Syllabus order, unit by unit.</b> Each topic builds on the one before it. The only look-backs are the short revision slots, spaced out so earlier units do not fade.</li>
      <li><b>Full answers by hand tonight.</b> Practising in the same form as the exam makes recall in the hall easier.</li>
      <li><b>Sleep, then a light morning.</b> Memory settles overnight; exam morning is for recall, not new material.</li>
    </ul></details>
    <button class="pl-reset" type="button" data-reset>Clear all ticks</button>
  </div>`;

/* exam clock: the water level is the share of time left between the plan's start and the paper */
function drawClock() {
  const el = document.getElementById("clock"), now = Date.now();
  const left = Math.max(0, PAPER - now), frac = Math.max(0, Math.min(1, left / (PAPER - START)));
  const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000);
  const C = 2 * Math.PI * 58, R = 50, cy = 66, top = cy + R - frac * 2 * R;
  const wave = (y, amp, ph) => { let d = `M${-60 + ph} ${y}`; for (let x = -60; x <= 200; x += 30) d += ` q 7.5 ${-amp} 15 0 t 15 0`; return d + ` V 140 H -60 Z`; };
  const over = left <= 0, hw = Math.sqrt(Math.max(0, R * R - (top - cy) ** 2)), wx = Math.max(22, cy - hw + 7);
  el.setAttribute("aria-label", over ? "The paper has started" : `${h} ${h === 1 ? "hour" : "hours"} ${m} ${m === 1 ? "minute" : "minutes"} until the paper`);
  el.innerHTML = `<svg viewBox="0 0 132 132" aria-hidden="true">
    <defs><clipPath id="bowl"><circle cx="66" cy="66" r="${R}"/></clipPath></defs>
    <circle class="ck-track" cx="66" cy="66" r="58"/>
    <circle class="ck-ring" cx="66" cy="66" r="58" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(2)}" transform="rotate(-90 66 66)"/>
    <circle class="ck-bowl" cx="66" cy="66" r="${R}"/>
    <g clip-path="url(#bowl)">
      <path class="ck-water2 ck-wave2" d="${wave(top + 2, 3, 15)}"/>
      <path class="ck-water ck-wave" d="${wave(top, 4, 0)}"/>
      ${frac > .1 && frac < .9 ? `<g class="ck-bob"><g transform="translate(${wx.toFixed(1)} ${(top - 15).toFixed(1)}) scale(.52)">${WHALE}</g></g>` : ""}
    </g>
    ${over ? `<text class="ck-unit" x="66" y="70" text-anchor="middle">Paper time</text>`
      : `<text class="ck-num" x="72" y="68" text-anchor="middle">${h}h</text><text class="ck-unit" x="72" y="84" text-anchor="middle">${m} min</text>`}
  </svg><small>${over ? "Wednesday, 2:00 PM" : "until the paper"}</small>`;
}

function paint() {
  root.querySelectorAll(".pl-row[data-id]").forEach(r => { const on = !!done[r.dataset.id]; r.classList.toggle("done", on); r.querySelector(".pl-tick").setAttribute("aria-pressed", on); });
  const n = today.filter(x => done[x.id]).length;
  document.getElementById("pcount").textContent = `${n} of ${today.length} done today`;
  unitLists.forEach((list, k) => {
    const d = list.filter(x => done[x.id]).length, el = root.querySelector(`.pl-u[data-u="${k + 1}"]`);
    el.querySelector("b").style.width = (d / list.length * 100) + "%";
    el.classList.toggle("full", d === list.length);
  });
  P.forEach((x, i) => { if (x.k !== "B") return; const r = root.querySelector(`.pl-row[data-i="${i}"]`), open = x.req.every(id => done[id]); r.classList.toggle("open", open); r.querySelector(".pl-sub").textContent = open ? "Earned." : x.lock; });
  paintNow();
}

function paintNow() {
  const t = Date.now(), el = document.getElementById("now");
  root.querySelectorAll(".pl-row.now").forEach(r => r.classList.remove("now"));
  let cur = -1;
  const endOf = (x, i) => x.e ? ist(x.d, x.e) : (P[i + 1] && P[i + 1].d === x.d ? ist(x.d, P[i + 1].s) : (P[i + 1] ? ist(P[i + 1].d, P[i + 1].s) : PAPER));
  P.forEach((x, i) => { if (t >= ist(x.d, x.s) && t < endOf(x, i)) cur = i; });
  const nextI = P.findIndex(x => x.k !== "b" && ist(x.d, x.s) > t);
  const firstOpen = STUDY.find(x => !done[x.id]);
  const next = nextI >= 0 ? `<em>Next: ${P[nextI].t}, ${ampm(P[nextI].s)}</em>` : "";
  if (t >= PAPER) {
    el.innerHTML = `<small>Wednesday, 2:00 PM</small><strong>Paper time.</strong>`;
  } else if (cur >= 0 && P[cur].k === "e") {
    const x = P[cur], open = STUDY.filter(s => s.d === x.d && !done[s.id]).length;
    el.innerHTML = `<small>${x.d === D1 ? "Tuesday is done" : "Exam day"}</small><strong>${x.t}</strong><em>${x.sub}${open ? ` ${open} of the day's slots are not ticked yet.` : ""}</em>${next && x.d === D1 ? next : ""}`;
  } else if (cur >= 0) {
    const x = P[cur], left = Math.max(1, Math.round((ist(x.d, x.e) - t) / 60000));
    root.querySelector(`.pl-row[data-i="${cur}"]`).classList.add("now");
    const title = x.k === "b" ? `Break, ${mins(x.s, x.e)} minutes` : x.t;
    el.innerHTML = `<small>Now · until ${ampm(x.e)} · ${left} min left</small><strong>${title}</strong>${next}${x.k !== "b" ? `<button type="button" data-jump="${cur}">Go to this slot</button>` : ""}`;
  } else if (t < ist(D1, P[0].s)) {
    el.innerHTML = `<small>Starts Tuesday at 11:45 AM IST</small><strong>${P[0].t}</strong><em>${P[0].body}</em><button type="button" data-jump="0">Go to the first slot</button>`;
  } else if (firstOpen && ist(firstOpen.d, firstOpen.s) < t) {
    const i = P.indexOf(firstOpen);
    el.innerHTML = `<small>First slot not ticked yet</small><strong>${firstOpen.t}</strong><em>${firstOpen.kind}</em><button type="button" data-jump="${i}">Go to this slot</button>`;
  } else {
    el.innerHTML = `<small>${nextI >= 0 ? `Next at ${ampm(P[nextI].s)}` : "All set"}</small><strong>${nextI >= 0 ? P[nextI].t : "Every slot is ticked."}</strong>`;
  }
  drawClock();
}

root.addEventListener("click", e => {
  const tk = e.target.closest("[data-tick]");
  if (tk) { const id = tk.dataset.tick; if (done[id]) delete done[id]; else done[id] = 1; save(); return paint(); }
  const rn = e.target.closest("[data-run]");
  if (rn) { if (window.ExamTimer) { window.ExamTimer.run(+rn.dataset.run); root.querySelectorAll(".run.on").forEach(b => b.classList.remove("on")); rn.classList.add("on"); } return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const r = root.querySelector(`.pl-row[data-i="${j.dataset.jump}"]`); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const rs = e.target.closest("[data-reset]");
  if (rs) {
    if (!Object.keys(done).length) return;
    if (rs.dataset.armed) { done = {}; save(); paint(); delete rs.dataset.armed; rs.textContent = "Clear all ticks"; return; }
    rs.dataset.armed = "1"; rs.textContent = "Tap again to clear every tick";
    setTimeout(() => { delete rs.dataset.armed; rs.textContent = "Clear all ticks"; }, 4000);
  }
});

/* keep her place when she comes back from a topic */
const SK = "examtides.agileplan.scroll";
addEventListener("pagehide", () => { try { sessionStorage.setItem(SK, String(scrollY)); } catch (e) {} });
try { const y = +sessionStorage.getItem(SK); if (y) requestAnimationFrame(() => scrollTo(0, y)); } catch (e) {}
addEventListener("pageshow", ev => { if (ev.persisted) { try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {} paint(); } });

paint();
setInterval(paintNow, 30000);
})();
</script>
